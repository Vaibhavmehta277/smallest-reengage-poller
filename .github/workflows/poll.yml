name: reengagement-poller
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poller
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run poll cycle
        env:
          SMARTLEAD_KEY: ${{ secrets.SMARTLEAD_KEY }}
          HEYREACH_KEY: ${{ secrets.HEYREACH_KEY }}
        run: python orchestrator.py poll
      - name: Persist state
        run: |
          git config user.name "poller-bot"
          git config user.email "poller@bot"
          git add orchestrator_state.json
          git commit -m "state $(date -u +%FT%TZ)" || echo "no change"
          git push || echo "nothing to push"
